name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:   # 支持手动触发，tag 推送失败时可救场

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    name: Build macOS binaries + .pkg
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Read version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build universal binary
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin

          mkdir -p target/release-artifacts
          lipo -create \
            target/aarch64-apple-darwin/release/il \
            target/x86_64-apple-darwin/release/il \
            -output target/release-artifacts/il
          chmod +x target/release-artifacts/il

      - name: Create macOS universal tarball
        run: |
          cd target/release-artifacts
          tar -czf "il-${{ steps.version.outputs.version }}-macos-universal.tar.gz" il
          shasum -a 256 "il-${{ steps.version.outputs.version }}-macos-universal.tar.gz" > "il-${{ steps.version.outputs.version }}-macos-universal.tar.gz.sha256"

      - name: Build macOS installer package (flat package)
        run: |
          mkdir -p target/pkg-root
          cp target/release-artifacts/il target/pkg-root/il

          pkgbuild \
            --root target/pkg-root \
            --install-location /usr/local/bin \
            --identifier com.intentloop.pkg \
            --version "${{ steps.version.outputs.version }}" \
            --ownership recommended \
            "target/IntentLoop-${{ steps.version.outputs.version }}.pkg"

          cd target
          shasum -a 256 "IntentLoop-${{ steps.version.outputs.version }}.pkg" > "IntentLoop-${{ steps.version.outputs.version }}.pkg.sha256"

      - name: Create Release and upload macOS assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "IntentLoop v${{ steps.version.outputs.version }}"
          generate_release_notes: true
          files: |
            target/release-artifacts/il-${{ steps.version.outputs.version }}-macos-universal.tar.gz
            target/release-artifacts/il-${{ steps.version.outputs.version }}-macos-universal.tar.gz.sha256
            target/IntentLoop-${{ steps.version.outputs.version }}.pkg
            target/IntentLoop-${{ steps.version.outputs.version }}.pkg.sha256

  build-linux:
    name: Build Linux binaries
    runs-on: ubuntu-latest
    needs: build-macos                    # 明确等待 macOS job 先创建好 Release
    strategy:
      matrix:
        target: [x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Read version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Install cross-rs（推荐用于可靠的交叉编译）
        uses: taiki-e/install-action@cross

      - name: Build with cross（自动处理交叉编译器和 sysroot）
        run: cross build --release --target ${{ matrix.target }}

      - name: Package binary
        run: |
          cd target/${{ matrix.target }}/release
          if [[ "${{ matrix.target }}" == "x86_64-unknown-linux-gnu" ]]; then
            ARCH="x86_64"
          else
            ARCH="aarch64"
          fi
          tar -czf "il-${{ steps.version.outputs.version }}-linux-${ARCH}.tar.gz" il
          shasum -a 256 "il-${{ steps.version.outputs.version }}-linux-${ARCH}.tar.gz" > "il-${{ steps.version.outputs.version }}-linux-${ARCH}.tar.gz.sha256"
          mv *.tar.gz ../../..
          mv *.sha256 ../../..

      - name: Upload Linux assets 到已创建的 Release
        run: |
          gh release upload ${{ github.ref_name }} \
            "il-${{ steps.version.outputs.version }}-linux-*.tar.gz" \
            "il-${{ steps.version.outputs.version }}-linux-*.tar.gz.sha256" \
            --repo ${{ github.repository }} \
            --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
